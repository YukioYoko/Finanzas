name: Compilar app de Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # versionCode debe subir en cada envío a Play; run_number es incremental.
      VERSION_CODE: ${{ github.run_number }}
      # BASE_RUN = run_number que corresponde a 1.1.0. A partir de ahí el "patch"
      # cuenta 0..19 y cada 20 builds sube 1 el "minor": 1.1.0 … 1.1.19, 1.2.0 …
      BASE_RUN: 40
    steps:
      - uses: actions/checkout@v4

      - name: Calcular versionName (1.minor.patch, +1 al minor cada 20 builds)
        run: |
          N=$(( ${{ github.run_number }} - BASE_RUN ))
          if [ "$N" -lt 0 ]; then N=0; fi
          MINOR=$(( 1 + N / 20 ))
          PATCH=$(( N % 20 ))
          echo "VERSION_NAME=1.${MINOR}.${PATCH}" >> "$GITHUB_ENV"
          echo "versionName = 1.${MINOR}.${PATCH} (run ${{ github.run_number }}, code $VERSION_CODE)"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm install

      - name: Compilar la web
        run: npm run build

      - name: Sincronizar con Android
        run: npx cap sync android

      - name: Preparar keystore de firma
        id: keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/finanzas.jks"
            echo "path=$RUNNER_TEMP/finanzas.jks" >> "$GITHUB_OUTPUT"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Falta el secreto ANDROID_KEYSTORE_BASE64; se generará solo un APK debug (no sirve para Play)."
          fi

      - name: Compilar AAB y APK firmados (release)
        if: steps.keystore.outputs.signed == 'true'
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease
          cp app/build/outputs/bundle/release/app-release.aab ../finanzas.aab
          cp app/build/outputs/apk/release/app-release.apk ../finanzas.apk

      - name: Compilar APK debug (sin secretos de firma)
        if: steps.keystore.outputs.signed != 'true'
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../finanzas.apk

      - name: Subir el AAB para Play Console
        if: steps.keystore.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: finanzas-aab
          path: finanzas.aab
          retention-days: 30

      - name: Publicar release con el APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}-${{ github.run_number }}
          name: Mis Finanzas v${{ env.VERSION_NAME }} (build ${{ github.run_number }})
          files: finanzas.apk
          body: "APK de Mis Finanzas. Descárgalo en tu Android y ábrelo para instalar. El AAB para Play Store está en los artefactos de esta ejecución."
