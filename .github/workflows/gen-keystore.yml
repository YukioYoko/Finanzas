name: Generar keystore (una sola vez)

# Genera el keystore de firma EN LA NUBE y guarda los 4 secretos directamente en el
# repo, sin subir el archivo ni imprimir contraseñas (seguro incluso en repo público).
#
# Requisito: crea un token fino (Settings → Developer settings → Fine-grained tokens)
# con permiso "Secrets: Read and write" sobre este repo, y guárdalo como secreto GH_PAT.
# Luego corre este workflow desde la pestaña Actions. Al terminar, borra el secreto GH_PAT.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Comprobar token
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "::error::Falta el secreto GH_PAT (token fino con permiso de Secrets: write)."
            exit 1
          fi

      - name: Generar keystore y guardar secretos
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -e
          ALIAS="finanzas"
          STOREPASS="$(openssl rand -hex 24)"
          echo "::add-mask::$STOREPASS"

          keytool -genkeypair -v \
            -keystore finanzas-release.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias "$ALIAS" \
            -storepass "$STOREPASS" -keypass "$STOREPASS" \
            -dname "CN=Mis Finanzas, O=Mis Finanzas, C=MX"

          base64 -w0 finanzas-release.jks > keystore.b64.txt

          gh secret set ANDROID_KEYSTORE_BASE64 --repo "$GITHUB_REPOSITORY" < keystore.b64.txt
          gh secret set ANDROID_KEYSTORE_PASSWORD --repo "$GITHUB_REPOSITORY" --body "$STOREPASS"
          gh secret set ANDROID_KEY_PASSWORD --repo "$GITHUB_REPOSITORY" --body "$STOREPASS"
          gh secret set ANDROID_KEY_ALIAS --repo "$GITHUB_REPOSITORY" --body "$ALIAS"

          rm -f finanzas-release.jks keystore.b64.txt

      - name: Listo
        run: |
          echo "## Keystore generado y secretos guardados ✅" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Se crearon los secretos: \`ANDROID_KEYSTORE_BASE64\`, \`ANDROID_KEYSTORE_PASSWORD\`, \`ANDROID_KEY_PASSWORD\`, \`ANDROID_KEY_ALIAS\`." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Ahora:** borra el secreto \`GH_PAT\` (ya no se necesita) y haz un push a \`main\` para compilar la versión firmada." >> "$GITHUB_STEP_SUMMARY"
